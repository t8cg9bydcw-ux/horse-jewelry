<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Près de Toi — соберите своё изделие</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fdf8f3; color: #2c2c2c; padding: 16px; min-height: 100vh;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; color: #b8860b; font-weight: 300; letter-spacing: 2px; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #999; text-align: center; margin-bottom: 24px; letter-spacing: 1px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .screen-title { font-size: 18px; color: #b8860b; text-align: center; margin-bottom: 20px; font-weight: 500; }
  .btn {
    display: block; width: 100%; padding: 14px; margin-bottom: 12px;
    background: #fff; border: 2px solid #e8d5b0; border-radius: 14px;
    font-size: 15px; color: #2c2c2c; cursor: pointer; text-align: center;
    transition: all 0.2s;
  }
  .btn:hover { border-color: #b8860b; background: #fffaf0; }
  .btn.primary { background: #b8860b; color: #fff; border-color: #b8860b; }
  .btn.primary:hover { background: #a0750a; }
  .btn.back { background: transparent; border: none; color: #999; font-size: 14px; margin-bottom: 8px; text-align: left; padding: 8px 0; }
  .btn img { width: 100%; border-radius: 10px; margin-bottom: 8px; display: block; }
  .option-group { margin-bottom: 24px; }
  .option-group label { display: block; font-size: 14px; color: #b8860b; margin-bottom: 8px; font-weight: 500; }
  .option-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .option {
    padding: 8px; background: #fff; border: 2px solid #e8d5b0;
    border-radius: 10px; font-size: 13px; cursor: pointer; transition: all 0.2s;
    text-align: center; flex: 1 1 45%;
  }
  .option img { width: 100%; border-radius: 8px; margin-bottom: 6px; display: block; }
  .option.selected { border-color: #b8860b; background: #fffaf0; }
  .hint { font-size: 12px; color: #999; margin-top: 6px; line-height: 1.5; }
  input[type="text"], textarea {
    width: 100%; padding: 12px; border: 2px solid #e8d5b0; border-radius: 10px;
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  .note { font-size: 12px; color: #999; text-align: center; margin-top: 20px; line-height: 1.5; }
  .check-list { background: #fffaf0; border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.8; }
  .check-list b { color: #b8860b; }
</style>
</head>
<body>
<div class="container">
  <h1>Près de Toi</h1>
  <p class="subtitle">рядом с тобой</p>

  <!-- ЭКРАН 1 -->
  <div id="screen1" class="screen active">
    <p class="screen-title">Выберите тип изделия</p>
    <button class="btn" onclick="goTo(2, {type: 'Подвеска'})">
      <img src="foto1.jpg" alt="Подвеска">Подвеска
    </button>
    <button class="btn" onclick="goTo(2, {type: 'Брелок'})">
      <img src="foto2.jpg" alt="Брелок">Брелок
    </button>
  </div>

  <!-- ЭКРАН 2 -->
  <div id="screen2" class="screen">
    <button class="btn back" onclick="goTo(1)">← Назад</button>
    <p class="screen-title">Выберите формат изделия</p>
    <button class="btn" onclick="goTo(3, {format: 'Вариант 1'})">
      <img src="foto3.jpg" alt="Вариант 1">Вариант 1
    </button>
    <button class="btn" onclick="goTo(3, {format: 'Вариант 2'})">
      <img src="foto4.jpg" alt="Вариант 2">Вариант 2
    </button>
  </div>

  <!-- ЭКРАН 3 -->
  <div id="screen3" class="screen">
    <button class="btn back" onclick="goTo(2)">← Назад</button>
    <p class="screen-title" id="screen3Title">Сборка</p>
    <div id="buildContent"></div>
    <button class="btn primary" onclick="showCheck()">Перепроверить заказ</button>
  </div>

  <!-- ЭКРАН 4 -->
  <div id="screen4" class="screen">
    <button class="btn back" onclick="goTo(3)">← Назад</button>
    <p class="screen-title">Перепроверьте заказ</p>
    <div id="checkContent" class="check-list"></div>
    <button class="btn primary" onclick="sendOrder()">Отправить заявку</button>
  </div>

  <p class="note">Près de Toi · ручная работа · заявка откроется в чате с мастером</p>
</div>

<script>
let order = { type: '', format: '' };
let choices = {};

function goTo(n, data) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');
  if (data) Object.assign(order, data);
  if (n === 3) buildStep3();
  window.scrollTo(0, 0);
}

function selectOption(el, key, value) {
  const parent = el.parentElement;
  parent.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  choices[key] = value;
}

// ---------- ЭКРАН 3 ----------
function buildStep3() {
  const c = document.getElementById('buildContent');
  const t = document.getElementById('screen3Title');
  let html = '';
  choices = {}; // сброс выбора

  // ПОДВЕСКА + ВАРИАНТ 1
  if (order.type === 'Подвеска' && order.format === 'Вариант 1') {
    t.textContent = 'Сборка подвески · Вариант 1';
    html = `
      <div class="option-group">
        <label>1. Фото лошади</label>
        <p class="hint">Для лучшего изображения пришлите несколько вариантов с разных сторон.</p>
      </div>
      <div class="option-group">
        <label>2. Фурнитура (металл)</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'metal','Имитация серебра')"><img src="foto9.jpg">Серебро</div>
          <div class="option" onclick="selectOption(this,'metal','Имитация золота')"><img src="foto7.jpg">Золото</div>
          <div class="option" onclick="selectOption(this,'metal','Имитация розового золота')"><img src="foto8.jpg">Розовое золото</div>
        </div>
      </div>
      <div class="option-group">
        <label>3. Ваши пожелания к заказу</label>
        <textarea id="wishes" rows="3" placeholder="Напишите пожелания"></textarea>
      </div>
    `;
  }

  // ПОДВЕСКА + ВАРИАНТ 2
  if (order.type === 'Подвеска' && order.format === 'Вариант 2') {
    t.textContent = 'Сборка подвески · Вариант 2';
    html = `
      <div class="option-group">
        <label>1. Фото для изделия</label>
        <p class="hint">1 фото, которое хотите видеть в изделии.</p>
      </div>
      <div class="option-group">
        <label>2. Форма и размер</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'form','Круг 2,5 см')"><img src="foto13.jpg">Круг 2,5 см</div>
          <div class="option" onclick="selectOption(this,'form','Квадрат 2,5×2,5 см')"><img src="foto10.jpg">Квадрат 2,5×2,5</div>
          <div class="option" onclick="selectOption(this,'form','Прямоугольник 2×3 см')"><img src="foto11.jpg">Прямоуг. 2×3</div>
          <div class="option" onclick="selectOption(this,'form','Овал 2×2,5 см')"><img src="foto12.jpg">Овал 2×2,5</div>
        </div>
      </div>
      <div class="option-group">
        <label>3. Декор рядом с фото</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'decor','Есть')">Есть</div>
          <div class="option" onclick="selectOption(this,'decor','Нет')">Нет</div>
        </div>
      </div>
      <div class="option-group">
        <label>4. Предпочитаемый цвет декора</label>
        <input type="text" id="decorColor" placeholder="Напишите цвет">
        <p class="hint">Выбор элементов декора согласовывается с мастером индивидуально.</p>
      </div>
      <div class="option-group">
        <label>5. Фурнитура (металл)</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'metal','Имитация серебра')"><img src="foto9.jpg">Серебро</div>
          <div class="option" onclick="selectOption(this,'metal','Имитация золота')"><img src="foto7.jpg">Золото</div>
          <div class="option" onclick="selectOption(this,'metal','Имитация розового золота')"><img src="foto8.jpg">Розовое золото</div>
        </div>
      </div>
      <div class="option-group">
        <label>6. Ваши пожелания к заказу</label>
        <textarea id="wishes" rows="3" placeholder="Напишите пожелания"></textarea>
      </div>
    `;
  }

  // БРЕЛОК + ВАРИАНТ 1
  if (order.type === 'Брелок' && order.format === 'Вариант 1') {
    t.textContent = 'Сборка брелока · Вариант 1';
    html = `
      <div class="option-group">
        <label>1. Фото лошади</label>
        <p class="hint">Для лучшего изображения пришлите несколько вариантов с разных сторон.</p>
      </div>
      <div class="option-group">
        <label>2. Обвес</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'obves','Есть'); showObves()">Есть</div>
          <div class="option" onclick="selectOption(this,'obves','Нет'); hideObves()">Нет</div>
        </div>
        <div id="obvesDetails" style="display:none; margin-top:12px;">
          <label>Цвет на обвесе</label>
          <input type="text" id="obvesColor" placeholder="Напишите цвет" style="margin-bottom:10px;">
          <label>Надпись на обвесе</label>
          <div class="option-row">
            <div class="option" onclick="selectOption(this,'obvesText','Имя')">Имя</div>
            <div class="option" onclick="selectOption(this,'obvesText','Дата')">Дата</div>
          </div>
        </div>
      </div>
      <div class="option-group">
        <label>3. Ваши пожелания к заказу</label>
        <textarea id="wishes" rows="3" placeholder="Напишите пожелания"></textarea>
      </div>
    `;
  }

  // БРЕЛОК + ВАРИАНТ 2
  if (order.type === 'Брелок' && order.format === 'Вариант 2') {
    t.textContent = 'Сборка брелока · Вариант 2';
    html = `
      <div class="option-group">
        <label>1. Вариант изделия</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'variant','Вариант 1')"><img src="foto5.jpg">Вариант 1</div>
          <div class="option" onclick="selectOption(this,'variant','Вариант 2')"><img src="foto6.jpg">Вариант 2</div>
        </div>
      </div>
      <div class="option-group">
        <label>2. Фото для изделия</label>
        <p class="hint">1 фото, которое хотите видеть в изделии.</p>
      </div>
      <div class="option-group">
        <label>3. Форма и размер</label>
        <div class="option-row">
          <div class="option" onclick="selectOption(this,'form','Круг 4,5 см')"><img src="foto13.jpg">Круг 4,5</div>
          <div class="option" onclick="selectOption(this,'form','Круг 2,5 см')"><img src="foto13.jpg">Круг 2,5</div>
          <div class="option" onclick="selectOption(this,'form','Квадрат 4×4 см')"><img src="foto10.jpg">Квадрат 4×4</div>
          <div class="option" onclick="selectOption(this,'form','Квадрат 2,5×2,5 см')"><img src="foto10.jpg">Квадрат 2,5</div>
          <div class="option" onclick="selectOption(this,'form','Прямоугольник 3,5×6,5 см')"><img src="foto11.jpg">Прямоуг. 3,5×6,5</div>
          <div class="option" onclick="selectOption(this,'form','Прямоугольник 2×3 см')"><img src="foto11.jpg">Прямоуг. 2×3</div>
          <div class="option" onclick="selectOption(this,'form','Овал 3,5×5,5 см')"><img src="foto12.jpg">Овал 3,5×5,5</div>
          <div class="option" onclick="selectOption(this,'form','Овал 2×2,5 см')"><img src="foto12.jpg">Овал 2×2,5</div>
          <div class="option" onclick="selectOption(this,'form','Скруглённый треугольник 4,5 см')"><img src="foto14.jpg">Треугольник 4,5</div>
          <div class="option" onclick="selectOption(this,'form','Герб 5×3,5 см')"><img src="foto15.jpg">Герб 5×3,5</div>
        </div>
      </div>
      <div class="option-group">
        <label>4. Предпочитаемый цвет декора</label>
        <input type="text" id="decorColor" placeholder="Напишите цвет">
        <p class="hint">Выбор элементов декора согласовывается с мастером индивидуально.</p>
      </div>
      <div class="option-group">
        <label>5. Имя / дата</label>
        <input type="text" id="nameDate" placeholder="Напишите имя или дату">
      </div>
      <div class="option-group">
        <label>6. Ваши пожелания к заказу</label>
        <textarea id="wishes" rows="3" placeholder="Напишите пожелания"></textarea>
      </div>
    `;
  }

  c.innerHTML = html;
}

function showObves() {
  document.getElementById('obvesDetails').style.display = 'block';
}
function hideObves() {
  document.getElementById('obvesDetails').style.display = 'none';
}

// ---------- ЭКРАН 4 ----------
function showCheck() {
  const c = document.getElementById('checkContent');
  let html = `<b>Тип:</b> ${order.type}<br>`;
  html += `<b>Формат:</b> ${order.format}<br><br>`;

  for (let key in choices) {
    if (choices[key]) html += `<b>${translateKey(key)}:</b> ${choices[key]}<br>`;
  }

  const wishes = document.getElementById('wishes')?.value;
  const decorColor = document.getElementById('decorColor')?.value;
  const nameDate = document.getElementById('nameDate')?.value;
  const obvesColor = document.getElementById('obvesColor')?.value;

  if (decorColor) html += `<b>Цвет декора:</b> ${decorColor}<br>`;
  if (nameDate) html += `<b>Имя/дата:</b> ${nameDate}<br>`;
  if (obvesColor) html += `<b>Цвет обвеса:</b> ${obvesColor}<br>`;
  if (wishes) html += `<br><b>Пожелания:</b> ${wishes}<br>`;

  c.innerHTML = html;
  goTo(4);
}

function translateKey(key) {
  const map = {
    metal: 'Металл', form: 'Форма', decor: 'Декор', variant: 'Вариант',
    obves: 'Обвес', obvesText: 'Надпись на обвесе'
  };
  return map[key] || key;
}

// ---------- Отправка ----------
function sendOrder() {
  let text = `Заявка Près de Toi%0A%0A`;
  text += `Тип: ${order.type}%0A`;
  text += `Формат: ${order.format}%0A%0A`;
  for (let key in choices) {
    if (choices[key]) text += `${translateKey(key)}: ${choices[key]}%0A`;
  }
  const decorColor = document.getElementById('decorColor')?.value;
  const nameDate = document.getElementById('nameDate')?.value;
  const obvesColor = document.getElementById('obvesColor')?.value;
  const wishes = document.getElementById('wishes')?.value;
  if (decorColor) text += `Цвет декора: ${decorColor}%0A`;
  if (nameDate) text += `Имя/дата: ${nameDate}%0A`;
  if (obvesColor) text += `Цвет обвеса: ${obvesColor}%0A`;
  if (wishes) text += `Пожелания: ${wishes}%0A`;
  text += `%0AФото пришлю в чат.`;
  window.open(`https://t.me/batonesk?text=${text}`, '_blank');
}
</script>
</body>
</html>
